name: Taplo

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:

  taplo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: uncenter/setup-taplo@09968a8ae38d66ddd3d23802c44bf6122d7aa991 # v1
        with:
          version: "0.9.3"
      - name: Run Taplo
        run: taplo format --check
