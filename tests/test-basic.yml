name: Test basic usage - valid markdown
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid markdown file to check
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-md"
          cat > "$GITHUB_WORKSPACE/test-md/valid.md" << 'EOF'
          # Hello World

          This is a valid markdown file.

          ## Section

          Some content here.
          EOF

      - id: action
        uses: .
        with:
          args: "check ${{ github.workspace }}/test-md/valid.md"

      - name: Assert action succeeded
        run: |
          echo "PASS: mado check completed successfully on valid markdown"
