name: Test basic usage - valid markdown
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid Markdown file for mado to check
        run: |
          mkdir -p "$GITHUB_WORKSPACE/md-test"
          cat > "$GITHUB_WORKSPACE/md-test/valid.md" << 'EOF'
          # Hello World

          This is a valid Markdown file.

          ## Section

          Some content here.
          EOF

      - id: action
        uses: .
        with:
          args: "check ${{ github.workspace }}/md-test"

      - name: Assert action succeeded
        run: |
          echo "PASS: mado ran successfully on valid markdown"
