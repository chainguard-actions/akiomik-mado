name: Test basic usage - valid markdown
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run mado on valid markdown file
        id: action
        uses: .
        with:
          args: "check tests/fixtures/valid.md"

      - name: Assert action succeeded
        run: |
          echo "PASS: mado exited successfully on valid markdown"
