name: Test clean markdown passes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          args: check tests/fixtures/good/good.md
      - name: Assert mado installed and step succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ ! -x "$HOME/bin/mado" ]; then
            echo "FAIL: mado binary not installed at $HOME/bin/mado"
            exit 1
          fi
          "$HOME/bin/mado" --version
          echo "PASS"
