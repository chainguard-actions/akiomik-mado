name: Test custom args - help flag
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run mado with help flag
        id: action
        uses: .
        with:
          args: --help

      - name: Assert action succeeded
        run: |
          echo "PASS: mado --help succeeded"
