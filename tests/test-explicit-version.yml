name: Test explicit version input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid Markdown file for mado to check
        run: |
          mkdir -p "$GITHUB_WORKSPACE/md-version-test"
          cat > "$GITHUB_WORKSPACE/md-version-test/hello.md" << 'EOF'
          # Hello

          Testing with an explicit version.
          EOF

      - id: action
        uses: .
        with:
          version: "v0.3.2"
          args: "check ${{ github.workspace }}/md-version-test"

      - name: Assert action succeeded with explicit version
        run: |
          echo "PASS: mado ran successfully with explicit version v0.3.2"
