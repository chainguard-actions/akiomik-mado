name: Test failing check - invalid markdown
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a markdown file with issues
        run: |
          mkdir -p /tmp/md-bad
          # Create a markdown file with a bare URL (common mado lint violation)
          cat > /tmp/md-bad/bad.md << 'EOF'
          # Bad Markdown

          This has a bare URL: https://example.com

          And another one: http://github.com
          EOF

      - name: Run mado action on bad markdown (expect failure)
        id: action
        uses: .
        with:
          args: "check /tmp/md-bad/bad.md"
        continue-on-error: true

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected mado to fail on bad markdown, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: mado correctly failed on bad markdown"
