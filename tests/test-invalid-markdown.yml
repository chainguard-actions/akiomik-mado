name: Test invalid markdown - action should fail
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create an invalid markdown file (missing blank line after heading)
        run: |
          mkdir -p /tmp/md-invalid
          printf '# Heading\nNo blank line after heading.\n' > /tmp/md-invalid/invalid.md

      - name: Run mado on invalid markdown (expect failure)
        id: action
        uses: .
        with:
          args: check /tmp/md-invalid/invalid.md
        continue-on-error: true

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on invalid markdown, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed on invalid markdown"
