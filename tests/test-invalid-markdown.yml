name: Test invalid markdown detection
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run mado on invalid markdown file
        id: action
        uses: .
        with:
          args: "check tests/fixtures/invalid.md"
        continue-on-error: true

      - name: Assert action failed due to violations
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected mado to fail on invalid markdown but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: mado correctly detected violations in invalid markdown"
