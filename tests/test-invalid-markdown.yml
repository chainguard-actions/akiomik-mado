name: Test invalid markdown - action should fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a markdown file with a hard tab (mado rule violation)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-invalid"
          # Create a markdown file with a hard tab character which mado should flag
          printf '# Title\n\n\tThis line starts with a hard tab which violates mado rules.\n' \
            > "$GITHUB_WORKSPACE/test-invalid/bad.md"

      - id: action
        uses: .
        with:
          args: "check ${{ github.workspace }}/test-invalid/bad.md"
        continue-on-error: true

      - name: Assert action failed on invalid markdown
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on invalid markdown but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed on invalid markdown"
