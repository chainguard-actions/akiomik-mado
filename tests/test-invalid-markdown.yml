name: Test invalid markdown - mado should fail
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a markdown file with issues
        run: |
          mkdir -p /tmp/md-bad
          # Create a markdown file with a hard tab (MD010 violation)
          printf '# Title\n\n\tThis line has a hard tab.\n' > /tmp/md-bad/bad.md

      - name: Run mado on invalid markdown and expect failure
        id: mado_run
        uses: .
        with:
          args: "check /tmp/md-bad"
        continue-on-error: true

      - name: Assert mado reported an error
        env:
          OUTCOME: ${{ steps.mado_run.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected mado to fail on invalid markdown, but it succeeded"
            exit 1
          fi
          echo "PASS: mado correctly reported errors on invalid markdown"
