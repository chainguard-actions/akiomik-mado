name: Test invalid version is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "latest; echo pwned"
          args: check tests/fixtures/good/good.md
      - name: Assert step failed and nothing downloaded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid version"
            exit 1
          fi
          if ls mado-*.tar.gz >/dev/null 2>&1; then
            echo "FAIL: a release archive was downloaded"
            exit 1
          fi
          echo "PASS"
