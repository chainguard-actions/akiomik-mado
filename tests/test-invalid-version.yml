name: Test invalid version input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "not-a-version"
          args: "check ."

      - name: Assert action failed with invalid version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid version, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid version string"
